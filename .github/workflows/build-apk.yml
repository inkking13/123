name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: app/android
        # The debug build type loads its JS from a Metro dev server instead of
        # bundling it, so it can't run standalone off a phone. Release always
        # bundles the JS, and the generated project signs it with the debug
        # keystore by default (fine for sideloading, not for a store listing).
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: raid-commander-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Release APK build ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/release/app-release.apk
