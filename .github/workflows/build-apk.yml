name: Build Android and Windows

# The game (godot/), exported for Android and Windows. Runs on any branch that
# touches it; builds from main are published as the latest release.
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/build-apk.yml'
      - '.github/actions/setup-godot/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: ./.github/actions/setup-godot
        with:
          android: 'true'

      - name: Check scripts and play a raid headless
        run: |
          godot --headless --path godot -s res://tests/loadall.gd
          timeout 600 godot --headless --path godot -s res://tests/smoke.gd
          timeout 600 godot --headless --path godot -s res://tests/spells.gd

      - name: Export APK
        env:
          # A throwaway key for sideloading (password in the clear on purpose).
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/godot/android/proto.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: proto
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: raidproto
        run: |
          # Each build gets a higher version code, so it installs over the last one.
          sed -i "s/^version\/code=.*/version\/code=$((100 + GITHUB_RUN_NUMBER))/" godot/export_presets.cfg
          mkdir -p godot/build
          godot --headless --path godot --export-release "Android" build/raid-commander.apk
          ls -la godot/build

      - name: Export for Windows
        run: |
          mkdir -p godot/build/windows
          godot --headless --path godot --export-release "Windows" build/windows/RaidCommander.exe
          cd godot/build/windows && zip -q ../raid-commander-windows.zip RaidCommander.exe
          ls -la ..

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: raid-commander
          path: |
            godot/build/raid-commander.apk
            godot/build/raid-commander-windows.zip

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: game-${{ github.run_number }}
          name: Raid Commander ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          files: |
            godot/build/raid-commander.apk
            godot/build/raid-commander-windows.zip
