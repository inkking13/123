name: Deploy web version to GitHub Pages

# The game (godot/) exported for the browser. Every branch checks that the
# export works; only main goes live.
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/deploy-web.yml'
      - '.github/actions/setup-godot/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot

      - name: Export web build
        run: |
          mkdir -p godot/build/web
          godot --headless --path godot --export-release "Web" build/web/index.html
          ls -la godot/build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: godot/build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
